# Offline test config.
#
#   ./.venv/bin/python -m pytest tests/ -q
#
# `-p no:<plugin>` for seven plugins we never asked for. Sourcing ROS puts Jazzy's 3.12
# site-packages on PYTHONPATH, so the 3.10 pytest discovers the pytest11 entry points
# registered there and autoloads them. `launch_testing` imports `launch`, which imports
# `lark`, which the 3.10 venv does not have — and the run dies at startup with
#
#     ModuleNotFoundError: No module named 'lark'
#
# naming a package nobody has heard of and pointing at /opt/ros. Plugin loading happens
# before collection, so a conftest.py cannot fix this; it has to be here.
#
# Every shell that has just run bringup.sh has ROS sourced, which is to say: most of them.
[pytest]
testpaths = tests
addopts =
    -p no:ament_copyright
    -p no:ament_flake8
    -p no:ament_lint
    -p no:ament_pep257
    -p no:ament_xmllint
    -p no:launch_ros
    -p no:launch_testing
