# The testbed, in one file.
#
# `scripts/apply_config.py` renders this into the formats each reader actually demands:
#
#   configs/sim/settings.json                 AirSim's schema, read by the CarlaUE4 binary
#   ros2_ws/src/bringup/config/testbed.yaml   ROS's schema, read by rclpy's parameter system
#
# Both are GENERATED. Edit this file, not those.
#
# ---------------------------------------------------------------------------------------
# The three sections are named for WHEN a change takes effect, not for which file it lands
# in, because that is the difference that costs you time:
#
#   simulator:   restart the simulator          ~60 s
#   sidecar:     restart the sidecar            ~5 s   (simulator keeps running)
#   graph:       nothing — `ros2 param set`     live
#
# ---------------------------------------------------------------------------------------

simulator:
  map: Town10HD
  gpu: 1                    # nvidia-smi index, or a "10de:2d04" vendor:device pair.
                            # GPU 0 is the operator's and is regularly busy with UnrealEditor.

  # headless renders with no display server at all (-RenderOffScreen) and is what every
  # measurement in this project was taken with. `windowed` opens an actual Unreal window and
  # needs somewhere to put it: export DISPLAY, or give it a virtual screen with
  #     Xvfb :99 -screen 0 1280x720x24 &
  # Override for one run with `run_sim.sh --display windowed`.
  display: headless

  # 1.0 and leave it there. AirSim's ClockSpeed accelerates SimpleFlight but NOT CARLA, so
  # anything else desynchronises the two halves of the world.
  clock_speed: 1.0

  # Geodetic origin. Null means AirSim's own default, which is Redmond, Washington and has no
  # relationship to Town10HD — a fine GPS *sensor*, a meaningless *position*. Set all three to
  # pin somewhere deliberate.
  gps_origin:
    lat: null
    lon: null
    alt: 0.0

  # The drone's own cameras. ALL THREE MUST STAY 4:3. `fov` is horizontal, so two buffers with
  # matching fov and different aspect ratios cover different VERTICAL fields, and
  # `frames.scale_to()` then maps an RGB pixel onto the wrong depth pixel — silently, on every
  # waypoint. This is also why the drone camera is not 1920x1080.
  cameras:
    # 960x720, NOT 1280x720. 720 lines either way, but 1280x720 is 16:9 and every buffer
    # here must share ONE aspect ratio. Beyond the depth-lookup bug that causes, 16:9 narrows
    # the VERTICAL field 73.7 -> 58.7 deg, which pushes the level-flight row from 13.7% of
    # the frame down to 1.5% - the camera-pitch problem, made several times worse, on the
    # one axis a VLM has to reason about.
    rgb:          {width: 960, height: 720, fov: 90}
    depth:        {width: 160, height: 120, fov: 90}
    segmentation: {width: 320, height: 240, fov: 90}


# ---------------------------------------------------------------------------------------
# SENSORS — one list, whichever simulator provides them.
#
# `source` decides how a sensor is obtained, and the difference is not cosmetic:
#
#   airsim   POLLED over RPC, on the same path as image capture. Costs image rate:
#            5 Hz is -1.7%, 20 Hz is -28%. Measured, not estimated.
#   carla    PUSHED asynchronously from inside UE4. Free-floating actors that follow the
#            aircraft by transform, because CARLA has no actor for an AirSim vehicle.
#            No measurable cost to the image path.
#
# The four AirSim sensors below are created AUTOMATICALLY by AirSim for a multirotor — they
# answer whether or not they appear here. `enabled` controls whether the bridge PUBLISHES
# them, not whether they exist. AirSim LiDAR and distance sensors are the opposite: they do
# not exist without an explicit block and a simulator restart, which is why the lidar here is
# a CARLA one instead.
# ---------------------------------------------------------------------------------------

sensors:
  - name: imu
    source: airsim
    enabled: true
    topic: /fmu/out/sensor_combined          # px4_msgs/msg/SensorCombined

  - name: barometer
    source: airsim
    enabled: true
    topic: /fmu/out/vehicle_air_data         # px4_msgs/msg/VehicleAirData

  - name: magnetometer
    source: airsim
    enabled: true
    topic: /fmu/out/vehicle_magnetometer     # px4_msgs/msg/VehicleMagnetometer

  - name: gps
    source: airsim
    enabled: true
    topic: /fmu/out/sensor_gps               # px4_msgs/msg/SensorGps

  # A point cloud where every point carries the object id and semantic tag of what it hit.
  # Strictly more than depth for obstacle work.
  #
  # RANGE IS THE BINDING CONSTRAINT, not points_per_second — which counts rays CAST, not
  # points returned. With lower_fov -50 and a level sensor the steepest ray is 50 degrees
  # below horizontal, so the ground is only reachable below about `range * sin(50)` = 61 m
  # AGL. Above that this sees buildings and nothing else.
  - name: lidar
    source: carla
    enabled: true
    blueprint: sensor.lidar.ray_cast_semantic
    topic: /sensors/lidar/points             # sensor_msgs/msg/PointCloud2
    offset: {x: 0.0, y: 0.0, z: -0.4}        # metres, body FRD. Negative z is ABOVE.
    attributes:
      channels: "16"
      range: "80.0"
      # 120000 destabilised the simulator: CARLA's own RPC began timing out at 30 s and took
      # the sidecar down with it. Ray casting is CPU work inside UE4 competing with the
      # simulation it samples.
      points_per_second: "30000"
      rotation_frequency: "10"
      upper_fov: "10.0"
      lower_fov: "-50.0"
      horizontal_fov: "360.0"

  # Everything below is off. Kept as working examples — rediscovering the right attribute
  # names costs more than these lines do.

  - name: radar
    source: carla
    enabled: false
    blueprint: sensor.other.radar
    offset: {x: 0.3, y: 0.0, z: 0.0}
    attributes: {horizontal_fov: "45.0", vertical_fov: "30.0", range: "100.0",
                 points_per_second: "3000"}

  # Event camera: per-pixel brightness CHANGES rather than frames. Nothing in the AirSim set
  # is equivalent, and it is a genuinely different signal for a navigation policy.
  - name: events
    source: carla
    enabled: false
    blueprint: sensor.camera.dvs
    offset: {x: 0.5, y: 0.0, z: 0.1}
    attributes: {image_size_x: "640", image_size_y: "480", fov: "90.0"}

  # Object identity, not just class — what would let a scenario say "the second building on
  # the left" and be able to score it.
  - name: instances
    source: carla
    enabled: false
    blueprint: sensor.camera.instance_segmentation
    offset: {x: 0.5, y: 0.0, z: 0.1}
    attributes: {image_size_x: "640", image_size_y: "480", fov: "90.0", sensor_tick: "0.1"}


sidecar:
  socket: /tmp/carla_air_testbed.sock

  # The exterior camera that follows the aircraft. A CARLA sensor, so it is nearly free — but
  # not entirely: measured against the SIMULATOR's tick rate, 30 Hz at 1080p costs nothing
  # (59.8 vs 60.0) while 60 Hz costs 10 fps of simulation. Real-time factor stays 1.000
  # throughout, which is the trap — judge this by tick rate, never by RTF.
  chase_camera:
    width: 1920
    height: 1080
    # 20, not 30. At 1920x1080 the encoder could not keep up with 30 fps - measured 19 frames
    # dropped in 226, and the stop timed out with the file left unplayable. 1080p is worth
    # more here than the extra 10 fps of a spectator camera.
    fps: 20
    distance: 14.0          # metres behind
    above: 6.0              # metres above
    crf: 26                 # x264 constant-rate-factor for recordings; 23 near-transparent,
                            # 26 is ~2.2x smaller on moving footage, 30 is ~3.7x

  # Traffic. RE-READ LIVE: this block is reloaded on every spawn and on every 1 Hz steering
  # tick, so editing it changes pedestrians already walking, within a second, with no
  # restart. The rest of `sidecar:` needs the ~5 s restart; this does not.
  #
  # Counts here are DEFAULTS. A scenario's `traffic_vehicles`/`traffic_walkers` and an
  # explicit /sim/spawn_traffic request both override them.
  traffic:
    vehicles: 15
    walkers: 10
    radius_m: 70.0          # cluster radius. Ask for more vehicles than there are spawn
                            # points inside it and the sidecar falls back to MAP-WIDE and
                            # says so — Town10HD has ~45 within 70 m of the plaza.

    # Pedestrians are steered DIRECTLY, not by controller.ai.walker, which this build
    # accepts and silently ignores — measured 0/8 moving with it, 6/6 without. See
    # docs/todo.md T-03.
    walker_speed_min: 1.0   # m/s. 1.0-1.7 spans a stroll to a brisk walk. Each walker
    walker_speed_max: 1.7   # keeps a fixed position in this range, so widening it here
                            # changes live walkers without making them move as one.
    walker_arrive_m: 3.0    # how close counts as arrived; a new destination is chosen then
    walker_roam_m: 80.0     # how far the next destination may be from where they are


graph:
  ros_domain_id: 42         # NOT 0. On the default domain this merges with a sibling project
                            # publishing REAL PX4 topics of the same names.

  carla_air_bridge:
    odometry_rate_hz: 20.0
    sensor_rate_hz: 5.0     # the AirSim sensors above. See the cost note in `sensors:`.
    lidar_rate_hz: 10.0
    image_rate_hz: 8.0
    publish_depth: true
    publish_segmentation: false   # works, but ~77 ms per capture
    frame_id: drone
    setpoint_duration_s: 0.5      # how long a velocity/attitude command lives

  # vlm_client: and grounding: USED TO BE HERE. They moved to
  #   examples/vlm_navigation/config/vlm.yaml
  # when the VLM became an example rather than part of the simulator (todo.md R-02).
  # Someone installing a drone simulator should not find an Anthropic model name in its
  # config file. The example is launched separately and talks only to the ROS 2 interface.

  offboard_control:
    rate_hz: 10.0
    setpoint_duration_s: 0.5
    # 2.0, down from 5.0. The binding constraint is not the airframe, it is how far the
    # aircraft travels BLIND between looks. Claude measured p50 5.6-6.6 s, p95 9.5 s per
    # decision, so at 5 m/s a worst-case gap is 47 m of unobserved flight - more than twice
    # the 20 m step cap and six times the 8 m standoff. At 2.0 it is ~12 m typical, ~19 m
    # worst case, and the aircraft is re-observing before it has consumed its own step.
    #
    # `min_period_s: 1.0` in the example's config is a RATE LIMIT, not the latency; the
    # model has never answered in 1 s.
    max_speed_mps: 5.0        # the value E-01b was measured at. Demos override
                              # this per scenario — see `control:` in default.yaml.
    # Slew rate on the commanded velocity. 0 disables. Without it the velocity is recomputed
    # from scratch each tick and steps the moment a new waypoint arrives — every ~4 s with a
    # VLM — so the aircraft snaps onto each heading at full speed.
    max_accel_mps2: 2.5
    # Heading slew rate. The heading follows the instantaneous velocity, recomputed at 10 Hz,
    # so velocity wobble became visible jitter — and the drone camera is fixed to the
    # airframe, so the model's own view swings with it.
    max_yaw_rate_dps: 45.0    # smoothing; demos slow this right down per scenario
    max_step_m: 20.0          # as measured for E-01b; overridden per scenario
    standoff_m: 8.0
    arrival_radius_m: 2.0
    # THESE ARE NED, NOT AGL. The origin sits 27.45 m above the street on Town10HD, so the
    # real floor is 42.45 m AGL and the ceiling 147.45 m.
    # -24.0 is NOT a typo. The clamp is `clip(z, -max, -min)` in NED, where altitude is -z,
    # so a NEGATIVE min_altitude_m permits z ABOVE the origin plane - and the origin sits
    # 27.45 m above the street. -24.0 therefore allows 3.45 m AGL, which is what street-level
    # flight needs. At the old 15.0 the floor was 42.45 m AGL and a VLM aimed at the road
    # was clamped twelve times above it.
    #
    # This is a loaded gun: the floor exists so a waypoint on the ground cannot fly the
    # aircraft into it. Raise it back to 15.0 for anything scored above the rooftops.
    # 15.0 = 42.45 m AGL, the value E-01b was measured at. The street-level demo needs a
    # NEGATIVE floor to descend below the origin plane, and sets it per scenario rather than
    # here — a setting that lets a waypoint fly the aircraft into the ground should not be
    # the default for every scenario because one demo wants it.
    min_altitude_m: 15.0
    max_altitude_m: 120.0
    enabled: true

  episode_runner:
    results_dir: out/episodes
    status_rate_hz: 2.0

  recorder:
    record_dir: out/videos
    fps: 8.0
    draw_overlay: true
    # Also record the depth buffer, colourised, as <episode>-depth.mp4. This is what
    # `grounding` actually consumes — the model picks a pixel and the depth AT that pixel is
    # what becomes a distance — so a flight that went somewhere odd is far easier to explain
    # with this beside the RGB.
    record_depth: true
    depth_max_m: 200.0      # clip before colourising; AirSim writes sky as a huge value
    output_height: 0        # 0 = the camera's own size. The onboard view is evidence of what
                            # the model saw; upscaling it only inflates the file.
    crf: 26
